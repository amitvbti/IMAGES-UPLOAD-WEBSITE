<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CA DESIGN MATRIX</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <main class="page">


        <!-- HEADER -->

        <header class="header">

            <h1>CA DESIGN MATRIX</h1>

            <div class="subtitle">
                ARCHITECTURE&nbsp;&nbsp; | &nbsp;&nbsp;PLANNING&nbsp;&nbsp; | &nbsp;&nbsp;INTERIORS&nbsp;&nbsp; | &nbsp;&nbsp;LANDSCAPE
            </div>

        </header>



        <!-- UPLOAD SECTION -->

        <section class="upload-section">

            <div class="upload-line">

                <div class="line"></div>

                <button
                    type="button"
                    class="upload-button"
                    id="uploadButton"
                >
                    UPLOAD
                </button>

                <div class="line"></div>

            </div>


            <!-- File selection -->

            <input
                type="file"
                id="imageInput"
                accept="image/*"
                multiple
                hidden
            >


            <!-- Thumbnails -->

            <div
                class="thumbnail-grid"
                id="thumbnailGrid"
            ></div>

        </section>



        <!-- FOOTER -->

        <footer class="footer">


            <!-- Temporary Logo -->

            <div class="logo-container">

                <div class="temporary-logo">
                    CA
                </div>

            </div>


            <!-- Contact Details -->

            <div class="contact-details">

                <div class="contact-person">

                    <div>ER. HETAN PAREKHA</div>

                    <div>+91-9953801123</div>

                </div>


                <div class="contact-person">

                    <div>MR. DITIN PAREKHA</div>

                    <div>+91-9953801124</div>

                </div>

            </div>


        </footer>


    </main>


    <script src="script.js"></script>

</body>

</html>
