<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CA DESIGN MATRIX</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <main class="page">


        <!-- HEADER -->

        <header class="header">

            <h1>CA DESIGN MATRIX</h1>

            <div class="subtitle">
                ARCHITECTURE&nbsp;&nbsp; | &nbsp;&nbsp;PLANNING&nbsp;&nbsp; | &nbsp;&nbsp;INTERIORS&nbsp;&nbsp; | &nbsp;&nbsp;LANDSCAPE
            </div>

        </header>



        <!-- UPLOAD SECTION -->

        <section class="upload-section">

    <!-- Select images -->

    <div class="upload-line">

        <div class="line"></div>

        <button
            type="button"
            class="upload-button"
            id="selectImagesButton"
        >
            SELECT IMAGES
        </button>

        <div class="line"></div>

    </div>


    <input
        type="file"
        id="imageInput"
        accept="image/*"
        multiple
        hidden
    >


    <!-- Selected image thumbnails -->

    <div
        class="thumbnail-grid"
        id="thumbnailGrid"
    ></div>


    <!-- Final upload confirmation -->

    <div
        class="final-upload-container"
        id="finalUploadContainer"
    >

        <button
            type="button"
            class="final-upload-button"
            id="finalUploadButton"
        >
            UPLOAD SELECTED PHOTOS
        </button>

    </div>

</section>



        <!-- FOOTER -->

        <footer class="footer">


            <!-- Temporary Logo -->

            <div class="logo-container">

    <img
        src="LOGO.jpg"
        alt="CA Design Matrix Logo"
        class="company-logo"
    >



            <!-- Contact Details -->

            <div class="contact-details">

                <div class="contact-person">

                    <div>ER. HETAN PAREKHA</div>

                    <div>+91-9953801123</div>

                </div>


                <div class="contact-person">

                    <div>MR. DITIN PAREKHA</div>

                    <div>+91-9953801124</div>

                </div>

            </div>


        </footer>


    </main>


    <script src="script.js"></script>

</body>

</html>
